name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Fork PRs can't read secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: app
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'weekly-fitness-tracker-54402' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

      # Validate the service account without printing it; problems show up as annotations.
      - name: Check deploy credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing or empty"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          # On a parse failure, report only the shape of the secret (never its contents).
          if ! node -e '
            const t = require("fs").readFileSync(process.argv[1], "utf8");
            try { JSON.parse(t); } catch (e) {
              const pos = +(/position (\d+)/.exec(e.message) || [])[1];
              const before = isNaN(pos) ? "" : t.slice(0, pos);
              const line = before.split("\n").length, keys = (t.match(/"[a-z_]+":/g) || []).length;
              console.log(`::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON (length ${t.length}, ${t.split("\n").length} lines, ${keys} keys, error at line ${line || "?"}, char code there ${isNaN(pos) ? "?" : t.charCodeAt(pos)}, has private_key: ${t.includes("\"private_key\"")}, BEGIN/END key markers: ${t.includes("BEGIN PRIVATE KEY")}/${t.includes("END PRIVATE KEY")})`);
              process.exit(1);
            }' "$RUNNER_TEMP/sa.json"; then exit 1; fi
          KEY_PROJECT=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).project_id' "$RUNNER_TEMP/sa.json")
          if [ "$KEY_PROJECT" != "$PROJECT_ID" ]; then
            echo "::error::Key is for project '$KEY_PROJECT' but deploying to '$PROJECT_ID'"; exit 1
          fi
          echo "::notice::Credentials OK for $PROJECT_ID"

      # main goes live; pull requests get a 7-day preview channel.
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CMD="hosting:channel:deploy pr-${{ github.event.number }} --expires 7d"
          else
            CMD="deploy --only hosting"
          fi
          set -o pipefail
          if ! npx --yes firebase-tools@13 $CMD --project "$PROJECT_ID" --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            echo "::error title=Firebase deploy failed::$(grep -iE 'error|denied|permission|not found' "$RUNNER_TEMP/deploy.log" | tail -5 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice::$(grep -E 'Hosting URL|Channel URL' "$RUNNER_TEMP/deploy.log" | tail -1)"

      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
